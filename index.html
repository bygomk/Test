<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292622">
<title>Dear — Typewriter v0.6</title>
<style>
:root{
  --paper:#b9b0a0; --ink:#29251f; --rail-y:68%;
  --lamp-x:50%; --lamp-y:43%;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#282521}
body{font-family:Georgia,serif;color:#e5dfd3;overscroll-behavior:none}
.app{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden;background:
 radial-gradient(ellipse at 50% 115%,rgba(0,0,0,.05),rgba(0,0,0,.52) 70%),
 linear-gradient(110deg,#39342e,#292622 62%,#35302a)}
.paper{
 position:absolute;inset:0 0 31% 0;
 background-color:#81796d;
 background-image:
  radial-gradient(ellipse at 50% 48%,rgba(211,196,166,.10),transparent 58%),
  radial-gradient(ellipse at 8% 12%,rgba(28,24,20,.23),transparent 42%),
  radial-gradient(ellipse at 92% 82%,rgba(25,22,19,.24),transparent 46%),
  linear-gradient(115deg,rgba(255,255,255,.035),transparent 38%,rgba(20,17,14,.10));
 box-shadow:0 12px 40px rgba(0,0,0,.28);
}
.paper:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background:
 repeating-linear-gradient(7deg,transparent 0 17px,rgba(45,35,25,.10) 18px,transparent 19px 43px),
 repeating-linear-gradient(97deg,transparent 0 29px,rgba(255,245,220,.08) 30px,transparent 31px 61px);mix-blend-mode:overlay}
.status{position:absolute;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;height:42px;padding:12px 6%;display:flex;justify-content:space-between;font:14px Georgia,serif;letter-spacing:.08em;color:#e5dfd3;text-shadow:0 1px 4px #332d27}
.toolbar{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 55px);left:7%;right:7%;display:flex;align-items:center;justify-content:space-between;color:#e7e0d4}
.tool{border:0;background:transparent;color:inherit;font-size:27px;padding:4px 0;line-height:1;cursor:pointer}
.count{font:16px "Courier New",monospace;letter-spacing:.12em;color:#e8e0d2}
.editor-wrap{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 118px);left:22%;right:9%;bottom:32%;overflow:hidden}
#letter{width:100%;height:100%;resize:none;scroll-behavior:auto;border:0;outline:0;background:transparent;color:#26221d;
 font-family:"Courier New",Courier,monospace;font-size:clamp(18px,5.2vw,24px);font-weight:700;line-height:1.28;letter-spacing:-.045em;
 text-shadow:0 .3px rgba(0,0,0,.25);white-space:pre-wrap;overflow:auto;caret-color:#33291f;padding:0 0 30px;
 -webkit-appearance:none;appearance:none}
#letter::placeholder{color:rgba(41,37,31,.52)}
.rail{position:absolute;z-index:4;left:0;right:0;top:var(--rail-y);height:56px;transform:translateY(-50%);
 background:linear-gradient(180deg,#080909,#252626 38%,#080909 78%,#151515);box-shadow:0 8px 16px #0008}
.rail:before,.rail:after{content:"";position:absolute;top:-5px;width:28px;height:66px;background:linear-gradient(90deg,#080909,#252525,#090909);border-radius:3px}
.rail:before{left:1%}.rail:after{right:1%}
.carriage{position:absolute;z-index:5;top:var(--rail-y);left:50%;width:184px;height:78px;transform:translate(-50%,-50%);border-radius:44px;
 background:linear-gradient(145deg,#454440,#292826 70%);box-shadow:inset 0 2px 4px #7775,0 8px 16px #0009;transition:left .16s ease}
.carriage.key-tap{animation:keyTap .09s ease-out}
.carriage.returning{animation:carriageReturn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes carriageReturn{0%{filter:brightness(1.22);transform:translate(-50%,-50%) translateX(0)}
 45%{filter:brightness(1.08);transform:translate(-50%,-50%) translateX(-9px)}
 100%{filter:brightness(1);transform:translate(-50%,-50%) translateX(0)}}
@keyframes keyTap{0%{filter:brightness(1.18);transform:translate(-50%,-50%) translateY(-2px)}100%{filter:brightness(1);transform:translate(-50%,-50%)}}
.carriage:before{content:"";position:absolute;left:50%;top:-36px;width:6px;height:39px;transform:translateX(-50%);background:linear-gradient(90deg,#171717,#555,#171717)}
.carriage:after{content:"";position:absolute;left:50%;top:-42px;transform:translateX(-50%);width:36px;height:9px;border-radius:1px;background:linear-gradient(#111,#333);box-shadow:0 2px 3px #0008}
.lights{position:absolute;left:22px;top:34px;display:flex;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#5f3026;box-shadow:0 0 3px #000}
.dot:first-child{background:#78c96b;box-shadow:0 0 7px #76d36d}
.dot:nth-child(2){background:#ff9d36}
.lamp-beam{position:absolute;z-index:1;left:var(--lamp-x);top:var(--rail-y);width:min(112vw,650px);height:min(66vh,650px);transform:translate(-50%,-100%);pointer-events:none;
 background:radial-gradient(ellipse at 50% 100%,rgba(255,239,194,.34) 0%,rgba(255,232,181,.23) 20%,rgba(255,225,169,.11) 43%,rgba(255,222,164,.035) 66%,transparent 78%);
 filter:blur(17px);mix-blend-mode:screen}
.more{position:absolute;z-index:7;right:8%;bottom:calc(env(safe-area-inset-bottom,0px) + 7%);width:68px;height:68px;border-radius:50%;border:1px solid #d8c8ad;background:rgba(196,181,157,.65);color:#e9dfce;font-size:27px;box-shadow:0 4px 16px #0005}
.hint{position:absolute;z-index:7;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2%);text-align:center;font:11px "Courier New",monospace;color:#d6cbb9aa;letter-spacing:.08em;pointer-events:none}
@media(max-height:650px){.editor-wrap{bottom:35%}.rail{top:65%}.carriage{top:65%}}
</style>
</head>
<body>
<main class="app">
 <div class="paper"></div><div class="lamp-beam"></div>
 <div class="status"><span>4:25 AM</span><span>▰ 10%</span></div>
 <nav class="toolbar">
  <button class="tool" aria-label="Back" id="back">‹</button>
  <span class="count" id="count">0 / 3,000</span>
  <button class="tool" aria-label="Share" id="share">⇧</button>
 </nav>
 <section class="editor-wrap">
  <textarea id="letter" dir="auto" maxlength="3000" spellcheck="false" autocapitalize="sentences" placeholder="Dear..."></textarea>
 </section>
 <div class="rail"></div>
 <div class="carriage" id="carriage"><div class="lights"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div>
 <button class="more" id="more" aria-label="More">•••</button>
 <div class="hint">TAP THE PAPER TO BEGIN</div>
</main>

let audioDecodePromise = null;
function prepareTypewriterAudio(){
  if(audioDecodePromise) return audioDecodePromise;
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return Promise.resolve(false);
    typewriterAudioContext = typewriterAudioContext || new AudioCtx({latencyHint:'interactive'});
    audioDecodePromise = Promise.all([
      Promise.all(keySampleData.map(async data=>{
        const response = await fetch(data);
        const bytes = await response.arrayBuffer();
        return await typewriterAudioContext.decodeAudioData(bytes);
      })),
      (async()=>{
        const response = await fetch(returnSampleData);
        const bytes = await response.arrayBuffer();
        return await typewriterAudioContext.decodeAudioData(bytes);
      })()
    ]).then(([buffers, returnClip])=>{
      keyBuffers=buffers;
      returnBuffer=returnClip;
      return true;
    }).catch(()=>false);
    return audioDecodePromise;
  }catch(e){ return Promise.resolve(false); }
}
// Start decoding as soon as the page loads, before the user begins typing.
prepareTypewriterAudio();
// Resume the already-decoded audio context directly from the user's first touch.
document.addEventListener('pointerdown',()=>{
  if(typewriterAudioContext && typewriterAudioContext.state==='suspended')
    typewriterAudioContext.resume().catch(()=>{});
},{capture:true});
let lastKeySample=-1;
function playRealKey(){
  if(!typewriterAudioContext || !keyBuffers.length) return;
  if(typewriterAudioContext.state==='suspended')
    typewriterAudioContext.resume().catch(()=>{});
  // Avoid adjacent identical strikes while keeping the original recorded sound.
  let index=Math.floor(Math.random()*keyBuffers.length);
  if(keyBuffers.length>1 && index===lastKeySample) index=(index+1)%keyBuffers.length;
  lastKeySample=index;
  const source=typewriterAudioContext.createBufferSource();
  const gain=typewriterAudioContext.createGain();
  source.buffer=keyBuffers[index];
  gain.gain.value=0.62;
  source.connect(gain);
  gain.connect(typewriterAudioContext.destination);
  const when=typewriterAudioContext.currentTime+(typewriterAudioContext.state==='running'?0:0.012);
  source.start(when);
}
function playRealReturn(){
  if(!typewriterAudioContext || !returnBuffer) return;
  if(typewriterAudioContext.state==='suspended')
    typewriterAudioContext.resume().catch(()=>{});
  const source=typewriterAudioContext.createBufferSource();
  const gain=typewriterAudioContext.createGain();
  source.buffer=returnBuffer;
  gain.gain.value=0.78;
  source.connect(gain);
  gain.connect(typewriterAudioContext.destination);
  source.start(typewriterAudioContext.currentTime);
}
function playRealDelete(){
  if(!typewriterAudioContext || !keyBuffers.length) return;
  if(typewriterAudioContext.state==='suspended')
    typewriterAudioContext.resume().catch(()=>{});
  const index=Math.floor(Math.random()*keyBuffers.length);
  const source=typewriterAudioContext.createBufferSource();
  const gain=typewriterAudioContext.createGain();
  source.buffer=keyBuffers[index];
  gain.gain.value=0.48;
  source.connect(gain);
  gain.connect(typewriterAudioContext.destination);
  source.start(typewriterAudioContext.currentTime);
}
let feedAnimation=0;
function advancePaper(){
 cancelAnimationFrame(feedAnimation);
 const style=getComputedStyle(field);
 const lineHeight=parseFloat(style.lineHeight)||24;
 const start=field.scrollTop;
 const target=start+lineHeight;
 const duration=230;
 const begin=performance.now();
 function step(now){
  const t=Math.min(1,(now-begin)/duration);
  const eased=1-Math.pow(1-t,3);
  field.scrollTop=start+(target-start)*eased;
  scheduleUpdate();
  if(t<1) feedAnimation=requestAnimationFrame(step);
 }
 feedAnimation=requestAnimationFrame(step);

 void carriage.offsetWidth;
 carriage.classList.add('returning');
 playRealReturn();
}
const mirror=document.createElement('div');
mirror.setAttribute('aria-hidden','true');
Object.assign(mirror.style,{

 whiteSpace:'pre-wrap',overflowWrap:'break-word',wordBreak:'normal',
 boxSizing:'border-box',margin:'0',border:'0'
});
document.body.appendChild(mirror);

function update(){
 const n=field.value.length;
 count.textContent=`${n.toLocaleString('en-US')} / 3,000`;
 const cs=getComputedStyle(field);
 const rect=field.getBoundingClientRect();

 // Mirror the textarea's text metrics so the marker lands at the real caret,
 // including wrapped lines, newlines, scrolling, RTL and mixed-direction text.
 for(const prop of ['fontFamily','fontSize','fontWeight','fontStyle','lineHeight','letterSpacing',
   'textIndent','textTransform','textAlign','paddingTop','paddingRight','paddingBottom',
   'paddingLeft','tabSize','direction']){
   mirror.style[prop]=cs[prop];
 }
 mirror.style.width=rect.width+'px';
 mirror.style.minHeight=rect.height+'px';
 mirror.style.height='auto';
 mirror.style.unicodeBidi='plaintext';
 mirror.dir=field.dir || 'auto';

 const pos=field.selectionStart ?? field.value.length;
 const before=field.value.slice(0,pos);
 mirror.replaceChildren(document.createTextNode(before));
 const marker=document.createElement('span');
 marker.textContent='\u200b';
 marker.style.display='inline-block';
 marker.style.width='1px';
 marker.style.padding='0';
 marker.style.margin='0';
 mirror.appendChild(marker);
 mirror.scrollTop=field.scrollTop;
 mirror.scrollLeft=field.scrollLeft;

 const caret=marker.getBoundingClientRect();
 let x=rect.left + caret.left - mirror.getBoundingClientRect().left - field.scrollLeft;
 if(!Number.isFinite(x) || (pos===0 && !before)) x=rect.left;
 const min=92, max=Math.max(min,window.innerWidth-92);
 x=Math.max(min,Math.min(max,x));
 carriage.style.left=x+'px';

 const lineY=caret.top-mirror.getBoundingClientRect().top-field.scrollTop;
 document.documentElement.style.setProperty('--lamp-x',`${(x/window.innerWidth)*100}%`);
 document.documentElement.style.setProperty('--lamp-y',`${Math.max(24,Math.min(55,24+lineY/Math.max(1,rect.height)*24))}%`);
}
let updateFrame=0;
function scheduleUpdate(){
 cancelAnimationFrame(updateFrame);
 updateFrame=requestAnimationFrame(update);
}
field.addEventListener('keydown',e=>{

  playRealDelete();
 }else if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey){
  playRealKey();
 }

field.addEventListener('input',()=>{

  void carriage.offsetWidth;
  carriage.classList.add('key-tap');

});
field.addEventListener('keyup',scheduleUpdate);
field.addEventListener('click',scheduleUpdate);
field.addEventListener('select',scheduleUpdate);
field.addEventListener('scroll',scheduleUpdate);
document.addEventListener('selectionchange',()=>{

});
window.addEventListener('resize',scheduleUpdate);
window.visualViewport?.addEventListener('resize',scheduleUpdate);
field.addEventListener('focus',()=>document.querySelector('.hint').style.opacity='.25');

});
document.getElementById('back').addEventListener('click',()=>{field.blur();});
document.getElementById('more').addEventListener('click',()=>{field.focus();});
